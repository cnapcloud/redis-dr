# Site A (active) - namespace site-a
# helm upgrade --install redis-a ot-helm/redis-replication --version 0.17.1 -n site-a --create-namespace -f values-sentinel-a.yaml
redisReplication:
  name: redis-a
  clusterSize: 3            # master 1 + replica 2
  image: quay.io/opstree/redis
  tag: v7.0.15              # redis-dr은 Redis 7 이상 필요

sentinel:
  enabled: true
  image: quay.io/opstree/redis-sentinel
  tag: v7.0.15
  size: 3
  downAfterMilliseconds: "5000"
  failoverTimeout: "10000"
  parallelSyncs: "1"

storageSpec:
  volumeClaimTemplate:
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
